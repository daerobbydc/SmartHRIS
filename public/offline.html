<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SmartHRIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #f0fdfa;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      color: #111827;
      margin-bottom: 12px;
    }
    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0f766e;
    }
    .features {
      margin-top: 32px;
      text-align: left;
      border-top: 1px solid #e5e7eb;
      padding-top: 24px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #374151;
    }
    .feature-icon {
      width: 32px;
      height: 32px;
      background: #f0fdfa;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Koneksi Terputus</h1>
    <p>Anda sedang dalam mode offline. Beberapa fitur mungkin tidak tersedia sampai koneksi pulih.</p>
    
    <a href="/dashboard" class="btn">Coba Lagi</a>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">✅</div>
        <span>Absen online (akan disync otomatis)</span>
      </div>
      <div class="feature">
        <div class="feature-icon">✅</div>
        <span>Lihat data karyawan</span>
      </div>
      <div class="feature">
        <div class="feature-icon">⚠️</div>
        <span>Upload data memerlukan koneksi</span>
      </div>
    </div>
  </div>
</body>
</html>
